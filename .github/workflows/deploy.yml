name: Deploy to Server

on:
  push:
    branches:
      - main  # Триггер для ветки main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v2

      # Шаг 2: Настройка SSH ключа
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Шаг 3: Развертывание приложения на сервере
      - name: Deploy to server
        run: ssh -v -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@109.196.101.168 "cd /var/www/chipipi/restaurant-api/ && sudo git pull origin main && cd .. && sudo docker-compose down && sudo docker-compose up -d restaurant-api"
