name: Deploy to Server

on:
  push:
    branches:
      - main  # Триггер для ветки main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v2

      # Шаг 2: Развертывание приложения на сервере
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@109.196.101.168 "cd /root/chipipi/restaurant-api/ && git pull origin main && cd .. && docker-compose down && docker-compose up -d restaurant-api"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
